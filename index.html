<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1533">
<title>Floodwood Pond</title>
<style>
  :root { --ink:#f4ead5; --glass:rgba(14,22,36,.55); --line:rgba(244,234,213,.22); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#0b1533; overflow:hidden; color:var(--ink);
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #title { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    transition:opacity 1.6s ease; padding:24px; cursor:pointer; z-index:5; }
  #title.hide { opacity:0; pointer-events:none; }
  #title h1 { font-weight:400; font-size:clamp(38px,9vw,92px); letter-spacing:.06em; margin:0 0 6px; text-shadow:0 2px 30px rgba(0,0,0,.5); }
  #title .sub { letter-spacing:.28em; text-transform:uppercase; font-size:clamp(11px,2.4vw,14px); opacity:.85; margin-bottom:38px; }
  #start { font:inherit; font-size:18px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink); background:rgba(244,234,213,.08);
    border:1px solid var(--line); border-radius:40px; padding:14px 38px; cursor:pointer; backdrop-filter:blur(8px); transition:background .3s, transform .3s; }
  #start:hover { background:rgba(244,234,213,.2); transform:translateY(-1px); }
  #start[disabled] { opacity:.5; cursor:wait; }
  #title .note { margin-top:22px; font-size:12px; opacity:.6; letter-spacing:.08em; max-width:420px; line-height:1.6; }
  .hud { position:fixed; z-index:3; opacity:0; transition:opacity 1.5s ease; pointer-events:none; }
  body.play .hud { opacity:1; }
  #clock { top:max(14px,env(safe-area-inset-top)); left:16px; font-size:15px; letter-spacing:.14em; text-shadow:0 1px 8px rgba(0,0,0,.6); }
  #clock small { display:block; opacity:.7; font-size:11px; letter-spacing:.2em; text-transform:uppercase; margin-top:2px; }
  #btns { top:max(10px,env(safe-area-inset-top)); right:12px; display:flex; gap:6px; pointer-events:auto; }
  #btns button { font:inherit; font-size:12px; color:var(--ink); background:var(--glass); border:1px solid var(--line); border-radius:20px;
    padding:7px 11px; cursor:pointer; backdrop-filter:blur(6px); letter-spacing:.06em; }
  #btns button:hover { background:rgba(60,80,110,.6); }
  #mini { right:12px; bottom:max(12px,env(safe-area-inset-bottom)); width:190px; height:140px; border-radius:10px; border:1px solid var(--line); background:var(--glass); overflow:hidden; backdrop-filter:blur(6px); }
  #mini canvas { width:100%; height:100%; display:block; }
  #hint { left:50%; bottom:max(22px,env(safe-area-inset-bottom)); transform:translateX(-50%); font-size:13px; letter-spacing:.08em; text-align:center; background:var(--glass);
    border:1px solid var(--line); border-radius:24px; padding:9px 18px; backdrop-filter:blur(6px); white-space:nowrap; transition:opacity 2.5s ease 0s; }
  #hint.fade { opacity:0 !important; }
  #joy { left:24px; bottom:max(26px,env(safe-area-inset-bottom)); width:132px; height:132px; border-radius:50%; background:rgba(14,22,36,.35); border:1px solid var(--line);
    pointer-events:auto; display:none; touch-action:none; }
  #joy i { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%; background:rgba(244,234,213,.35); border:1px solid var(--line); }
  body.touch #joy { display:block; } body.touch #hint { display:none; } body.touch #mini { width:140px; height:104px; bottom:auto; top:56px; }
  #toast { position:fixed; left:50%; top:20%; transform:translateX(-50%); font-size:clamp(20px,4vw,34px); letter-spacing:.2em; text-transform:uppercase; opacity:0; transition:opacity 1.6s; z-index:4; text-shadow:0 2px 24px rgba(0,0,0,.6); pointer-events:none; text-align:center; }
  #toast.on { opacity:1; }
  #mini { pointer-events:auto; cursor:pointer; }
  #mini::after { content:'Map'; position:absolute; right:8px; bottom:6px; font-size:11px; letter-spacing:.15em; text-transform:uppercase; opacity:.7; pointer-events:none; }
  .ver { position:absolute; left:0; right:0; bottom:max(14px,env(safe-area-inset-bottom)); font-size:12px; letter-spacing:.2em; opacity:.55; text-align:center; }
  .overlay { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; flex-direction:column;
    background:rgba(8,12,24,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); padding:20px; }
  .overlay.on { display:flex; }
  .panel { background:rgba(14,22,36,.82); border:1px solid var(--line); border-radius:18px; padding:28px 34px; text-align:center; min-width:min(320px,90vw); position:relative; }
  .panel h2 { font-weight:400; letter-spacing:.3em; text-transform:uppercase; font-size:22px; margin:0 0 22px; }
  .panel .menu button { display:block; width:100%; font:inherit; font-size:16px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink);
    background:rgba(244,234,213,.06); border:1px solid var(--line); border-radius:30px; padding:11px 22px; margin:9px 0; cursor:pointer; }
  .panel .menu button:hover { background:rgba(244,234,213,.18); }
  .panel .times { display:flex; gap:6px; justify-content:center; margin:14px 0 4px; flex-wrap:wrap; }
  .panel .times button { font:inherit; font-size:12px; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:16px; padding:5px 10px; cursor:pointer; }
  .panel .keys { font-size:12px; opacity:.7; line-height:1.9; margin-top:16px; letter-spacing:.05em; }
  .panel .ver { position:static; margin-top:14px; }
  #bigmap .wrap { position:relative; }
  #bigC { display:block; border-radius:12px; border:1px solid var(--line); cursor:crosshair; box-shadow:0 10px 50px rgba(0,0,0,.5); }
  #bigmap .cap { margin-top:12px; font-size:14px; letter-spacing:.1em; opacity:.85; text-align:center; }
  #mapClose { position:absolute; top:10px; right:10px; font:inherit; font-size:18px; color:var(--ink); background:rgba(14,22,36,.7); border:1px solid var(--line); border-radius:50%; width:36px; height:36px; cursor:pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="clock" class="hud"><span id="time">6:00 AM</span><small id="phase">Dawn</small></div>
<div id="btns" class="hud">
  <button id="pauseBtn" title="Pause (Esc)">❚❚</button><button data-t="5.7" title="Dawn (1)">Dawn</button><button data-t="12" title="Day (2)">Day</button><button data-t="18.3" title="Dusk (3)">Dusk</button><button data-t="22.5" title="Night (4)">Night</button><button id="mute" title="Mute (M)">Sound on</button>
</div>
<div id="mini" class="hud"><canvas id="miniC" width="380" height="280"></canvas></div>
<div id="hint" class="hud">W paddle &nbsp;·&nbsp; A / D steer &nbsp;·&nbsp; Shift paddle hard &nbsp;·&nbsp; drag to look &nbsp;·&nbsp; 1–4 time of day &nbsp;·&nbsp; Esc pause</div>
<div id="joy" class="hud"><i></i></div>
<div id="title">
  <div class="ver">v0.1.0</div>
</div>
<div id="pause" class="overlay"><div class="panel">
  <h2>Paused</h2>
  <div class="menu">
    <button id="pResume">Resume</button>
    <button id="pMute">Sound on</button>
    <button id="pRestart">Restart at the launch</button>
    <button id="pMenu">Main menu</button>
  </div>
  <div class="times"><button data-t="5.7">Dawn</button><button data-t="12">Day</button><button data-t="18.3">Dusk</button><button data-t="22.5">Night</button></div>
  <div class="keys">W paddle · A / D steer · S back-paddle · Shift paddle hard<br>Drag to look · N or tap minimap for the map · Esc pause · M mute</div>
  <div class="ver">v0.1.0</div>
</div></div>
<div id="bigmap" class="overlay"><div class="wrap"><canvas id="bigC"></canvas><button id="mapClose" title="Close (Esc)">×</button></div>
  <div class="cap">Tap anywhere on the water to paddle there</div></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
